name: Build macOS (RTL fork)

# Builds a self-signed WarpOss.app carrying the RTL patch, for personal use.
# Uses the public `oss` channel (no Sentry / no internal agent-debug features) so the
# build is fully self-contained and needs no Warp-internal secrets or Apple Developer cert.

# Dispatch-only, on purpose. This job runs on a macOS runner, which bills at
# 10x, and a release build takes ~140 minutes — roughly 1,400 of the account's
# 2,000 free minute-equivalents per month. Building on every push to rtl-fix
# consumed 7,023 equivalents in July 2026 and blocked Actions across every
# private repo on the account for three weeks. Build when you want an app.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        type: choice
        default: release
        options: [release, dev]

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 is Apple Silicon (arm64) — matches the target we bundle.
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin
          cargo --version

      - name: Authenticate git to GitHub (avoid anon rate-limits on cargo git deps)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          # Bust cache when Cargo.lock changes; share across profiles.
          shared-key: warp-macos-rtl

      - name: Install build deps
        run: |
          set -euo pipefail
          # protoc: the workspace compiles .proto files via prost-build. Not on
          # the GitHub macos image (upstream's own runners have it preinstalled).
          brew install protobuf
          protoc --version
          # create-dmg: script/macos/bundle calls it unconditionally to build
          # WarpOss.dmg (no skip flag). We ship the zipped .app, not the dmg, but
          # the bundle step aborts (exit 127) without it. Homebrew formula.
          brew install create-dmg
          create-dmg --version
          # Metal toolchain is preinstalled on GitHub's macos-15 image. The
          # `-downloadComponent MetalToolchain` flag isn't valid on that Xcode
          # (exits 64), so treat the download as best-effort and rely on the
          # bundled toolchain. If shader compilation later fails, revisit here.
          xcodebuild -downloadComponent MetalToolchain >/dev/null 2>&1 \
            || echo "Metal toolchain: using preinstalled (download not applicable on this Xcode)."
          # Note: private warp-channel-config and diesel_cli are intentionally
          # skipped — not needed for the oss app bundle.

      - name: Install cargo tooling (bundle + about)
        run: |
          set -euo pipefail
          # cargo-bundle assembles the .app.
          ./script/install_cargo_bundle || cargo install cargo-bundle --locked
          # cargo-about generates THIRD_PARTY_LICENSES.txt in the bundle's
          # post-step (prepare_bundled_resources). Pin matches the repo's
          # install_cargo_release_deps so it stays compatible with about.toml.
          cargo install --locked cargo-about@0.8.4

      - name: Bundle WarpOss.app (self-signed, arm64)
        env:
          # release (default) -> release-lto profile; dev -> fast debug build.
          PROFILE: ${{ github.event.inputs.profile || 'release' }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$PROFILE" = "dev" ]; then
            EXTRA="--debug"
          fi
          ./script/bundle --selfsign --arch aarch64 -c oss $EXTRA

      - name: Locate .app
        id: findapp
        run: |
          set -euo pipefail
          APP="$(find target -type d -path '*bundle/osx*' -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "No .app produced under target/**/bundle/osx" >&2
            find target -type d -name '*.app' || true
            exit 1
          fi
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      - name: Zip .app (preserve symlinks/perms)
        run: |
          set -euo pipefail
          APP="${{ steps.findapp.outputs.app_path }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" WarpOss-rtl-arm64.zip
          ls -lh WarpOss-rtl-arm64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WarpOss-rtl-arm64
          path: WarpOss-rtl-arm64.zip
          if-no-files-found: error
          retention-days: 30
