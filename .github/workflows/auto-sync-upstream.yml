name: Auto-sync rtl-fix with upstream

# Weekly: rebase the RTL fork branch onto the latest warpdotdev/warp master and,
# if it moved, push and kick a fresh macOS build. On a rebase conflict it stops
# and opens an issue instead of pushing anything, so a human can resolve it.
#
# A GITHUB_TOKEN push does not itself trigger other workflows, so we explicitly
# dispatch build-macos.yml after a successful push.

on:
  schedule:
    - cron: '17 9 * * 0' # Sundays 09:17 UTC
  workflow_dispatch: # allow manual runs

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: auto-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rtl-fix (full history)
        uses: actions/checkout@v4
        with:
          ref: rtl-fix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "warp-rtl-autosync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/warpdotdev/warp.git
          git fetch --no-tags upstream master

      - name: Rebase onto upstream/master
        id: rebase
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "Behind upstream/master by $BEHIND commit(s)."
          if [ "$BEHIND" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
            exit 0
          fi
          if git rebase upstream/master; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Rebased $BEHIND upstream commit(s) cleanly."
            exit 0
          fi

          # The fork deletes every upstream-only workflow, so any upstream edit to
          # one of those files comes back as a modify/delete conflict. That class is
          # mechanically decidable — the fork wants them gone — so resolve it here
          # and keep going. Anything else is a real conflict and needs a human.
          while true; do
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            [ -z "$CONFLICTED" ] && break
            OTHER=$(echo "$CONFLICTED" | grep -v '^\.github/workflows/' || true)
            if [ -n "$OTHER" ]; then
              echo "Non-workflow conflict(s):"; echo "$OTHER"
              git rebase --abort || true
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$CONFLICTED" | xargs git rm -q --
            if ! GIT_EDITOR=true git rebase --continue; then
              continue
            fi
            break
          done

          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git rebase --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Rebased $BEHIND upstream commit(s) (upstream-only workflow deletions auto-resolved)."

      - name: Strip upstream-only workflows
        if: steps.rebase.outputs.changed == 'true'
        run: |
          # The fork runs only its own two workflows. Everything else the rebase
          # pulls in from upstream is warpdotdev-internal ops automation that
          # either parse-fails on the fork (job-level `uses:` a private reusable
          # workflow like warpdotdev/oz-for-oss or warpdotdev/repo-sync) or
          # no-ops behind an `if: repository_owner == 'warpdotdev'` guard — pure
          # CI-failure-email noise. Strip them so a freshly-added upstream
          # workflow can't start spamming after a sync.
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name auto-sync-upstream.yml ! -name build-macos.yml -delete
          if ! git diff --quiet; then
            git add -A .github/workflows
            git commit -m "chore(ci): strip upstream-only workflows from the fork [skip ci]"
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.changed == 'true'
        run: git push --force-with-lease origin rtl-fix

      - name: Note that a build is available
        if: steps.rebase.outputs.changed == 'true'
        run: |
          # Deliberately NOT dispatching build-macos.yml. A release build takes
          # ~140 macOS minutes, and macOS bills at 10x, so one build costs ~1,400
          # of the account's 2,000 free minutes/month. Six auto-builds in July
          # 2026 burned 7,023 minute-equivalents and took CI down account-wide
          # for three weeks. Syncing is cheap; building is not — so the branch
          # is kept current automatically and the app is built on request.
          {
            echo "### rtl-fix synced with upstream"
            echo
            echo "No macOS build was started (a release build costs ~1,400 of the"
            echo "2,000 free minute-equivalents/month)."
            echo
            echo "Build it when you actually want a new app:"
            echo '```'
            echo "gh workflow run build-macos.yml --repo ${{ github.repository }} --ref rtl-fix -f profile=release"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on rebase conflict
        if: steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$(cat <<'EOF'
          The weekly auto-sync could not rebase `rtl-fix` onto `upstream/master` cleanly and aborted without pushing. A manual rebase is needed:

          ```
          cd ~/warp && git fetch upstream master && git rebase upstream/master
          ```

          Resolve the conflicts, then `git push --force-with-lease origin rtl-fix`.
          EOF
          )"
          gh issue create \
            --title "Auto-sync: rebase conflict with upstream" \
            --body "$body" \
            || echo "Issue creation failed (issues may be disabled on this repo)."
          # Fail the job regardless: issues are currently disabled on the fork, so a
          # green run on conflict means the sync silently stops and nobody is told.
          # A red run is the only reliable notification channel here.
          exit 1
